[project]
name = "supply-chain-anomaly-management"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
  { name = "Higor Rodrigues dos Santos Cruz", email = "higorrsc@gmail.com" },
]
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "ipykernel>=7.2.0",
  "ipython>=9.5.0",
  "mypy>=1.18.2",
  "mypy-extensions>=1.1.0",
  "pytest>=8.4.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.14.4",
]

# ------------------------------------------------------
# Mypy
# ------------------------------------------------------

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_untyped_defs = false
explicit_package_bases = true
ignore_missing_imports = true
namespace_packages = true
warn_unused_configs = true
exclude = ["alembic/versions"]

# ------------------------------------------------------
# Ruff
# ------------------------------------------------------

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# E: pycodestyle errors
# F: Pyflakes
# I: import sort
# W: warnings
# B: bugbear
# UP: pyupgrade
# N: naming
select = ["E", "F", "I", "W", "B", "UP", "N"]
ignore = []

[tool.ruff.lint.pycodestyle]
max-line-length = 100

# ------------------------------------------------------
# Pytest
# ------------------------------------------------------

[tool.pytest.ini_options]
pythonpath = "."
python_files = "tests.py tests_*.py *_tests.py test_*.py *_test.py"
addopts = "-v --import-mode=importlib"
testpaths = "tests"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = []
