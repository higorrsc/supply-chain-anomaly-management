services:
  db:
    image: postgres:18.6-alpine3.24
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-root} -d $${POSTGRES_DB:-sc_anomalies}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    volumes:
      - ./src:/app/src
      - ./anomaly_rules.yaml:/app/anomaly_rules.yaml
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dashboard
    restart: unless-stopped
    command: ["sh", "-c", "uv run streamlit run src/dashboard/app.py --server.port 8501 --server.address 0.0.0.0"]
    env_file: .env
    environment:
      API_URL: http://api:8000
    volumes:
      - ./src:/app/src
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    container_name: proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  postgres_data:
